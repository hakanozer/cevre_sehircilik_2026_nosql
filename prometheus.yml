global:
  scrape_interval: 5s
scrape_configs:
  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets: ["redis://redis:6379", "redis://replica:6379"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121